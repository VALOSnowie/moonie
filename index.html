<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 18th Birthday, Jian!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
:root{color-scheme:dark;--ink:#ffe8c4;--night:#040207;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;background:var(--night);scroll-padding-top:env(safe-area-inset-top,0px);overflow:hidden}
body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 60%,#2a1530,#07030b 70%);font-family:'Fraunces',Georgia,serif;color:var(--ink);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#stage{position:fixed;inset:0;cursor:pointer;outline:none;user-select:none;-webkit-user-select:none;transition:transform 1.1s cubic-bezier(.6,0,.2,1)}
svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#dark{position:absolute;inset:0;pointer-events:none;--r:200px;background:radial-gradient(circle at 50% 50%,rgba(4,2,7,0) 0,rgba(4,2,7,.4) calc(var(--r)*.5),#040207 var(--r))}
#c{position:fixed;inset:0;z-index:1;width:100%;height:100%;pointer-events:none}
#base,.oc{opacity:0;transition:opacity 1.8s ease}
#world.show #base,#world.show .oc{opacity:1}
.fl{transform:translate(0px,-62px) scale(.001)}
.fl.o{transition:transform .8s cubic-bezier(.3,1.7,.5,1)}
#world.on .fl.o{transform:translate(0px,-62px) scale(1)}
.gl{mix-blend-mode:screen}
.flick{transform-box:fill-box;transform-origin:50% 100%;animation:fl .45s ease-in-out infinite alternate}
@keyframes fl{0%{transform:scale(1,1) rotate(-2deg)}100%{transform:scale(.93,1.09) rotate(2deg)}}
.ember{animation:em 1.4s ease-in-out infinite alternate}
@keyframes em{0%{opacity:.35}100%{opacity:1}}
#title{position:fixed;z-index:3;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 5vh);margin:0;padding:0 16px;text-align:center;font-weight:600;font-size:clamp(28px,6.5vmin,64px);letter-spacing:-.01em;line-height:1.1;text-shadow:0 0 28px rgba(255,170,70,.45);opacity:0;transform:translateY(12px);transition:opacity 1.6s ease,transform 1.6s ease;pointer-events:none}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 8vh);margin:0;text-align:center;font-size:18px;color:rgba(255,232,196,.7);opacity:0;transition:opacity 1s;pointer-events:none}
#hint.show{opacity:1}
#hint.gone{opacity:0}
#open{position:fixed;z-index:4;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 4vh);transform:translateX(-50%);font:inherit;font-size:16px;color:var(--ink);background:rgba(4,2,7,.5);border:1px solid rgba(255,232,196,.4);border-radius:999px;padding:10px 22px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity 1.2s;white-space:nowrap}
#open:focus-visible,.pill:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
body.party #title{opacity:1;transform:none}
body.party #open{opacity:1;pointer-events:auto}

/* Letters */
#letters{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,36px);padding:calc(env(safe-area-inset-top,0px) + 16vh) 3vw calc(env(safe-area-inset-bottom,0px) + 14vh);box-sizing:border-box;transform:translateY(115vh);visibility:hidden;pointer-events:none;transition:transform 1.2s cubic-bezier(.6,0,.2,1),visibility 0s 1.2s}
body.letters #letters{transform:none;visibility:visible;pointer-events:auto;transition:transform 1.2s cubic-bezier(.6,0,.2,1) .25s,visibility 0s}
body.letters #stage{transform:translateY(115vh);pointer-events:none}
.paper{background:radial-gradient(ellipse at 18% 12%,rgba(255,242,205,.6),transparent 55%),radial-gradient(ellipse at 88% 92%,rgba(110,66,26,.4),transparent 55%),repeating-linear-gradient(8deg,rgba(110,72,30,.06) 0 2px,transparent 2px 6px),#d4b78a;box-shadow:inset 0 0 38px rgba(116,66,22,.6),inset 0 0 5px rgba(70,36,10,.7),0 16px 34px rgba(0,0,0,.6);border-radius:3px;color:#34200f}
.letter{position:relative;flex:none;width:clamp(96px,27vw,270px);aspect-ratio:3/4;padding:8% 7% 6%;box-sizing:border-box;overflow:hidden;cursor:pointer;transform:rotate(var(--rot));transition:transform .25s}
.letter:nth-child(1){--rot:-2.5deg}.letter:nth-child(2){--rot:1.2deg}.letter:nth-child(3){--rot:-1deg}
.letter:hover,.letter:focus-visible{transform:translateY(-8px) rotate(0deg);outline:none}
.letter:focus-visible{box-shadow:0 0 0 3px var(--ink),0 16px 34px rgba(0,0,0,.6)}
.pv{margin-top:9%;font:500 clamp(12px,2.3vw,20px)/1.2 'Caveat',cursive;white-space:pre-wrap;overflow:hidden;overflow-wrap:anywhere}
.pv.empty{opacity:.5}
.pol{position:relative;width:70%;margin:0 auto;padding:6% 6% 0;background:#f7f2e7;box-shadow:0 3px 8px rgba(40,20,5,.45);transform:rotate(-3deg)}
.pol::before{content:'';position:absolute;top:-8px;left:50%;width:34%;height:15px;transform:translateX(-50%) rotate(2deg);background:rgba(226,204,140,.75)}
.ph{aspect-ratio:1/1;background:#3a2c20 center/cover no-repeat;display:grid;place-items:center;text-align:center;color:#d8c8a6;font:600 clamp(11px,1.8vw,15px)/1.3 'Fraunces',serif;padding:6px;box-sizing:border-box}
.cap{display:block;box-sizing:border-box;width:100%;min-height:2.3em;font:500 clamp(11px,1.9vw,17px)/2.3 'Caveat',cursive;text-align:center;color:#34200f;background:none;border:0;outline:none;padding:0;overflow:hidden;white-space:nowrap}
#reader{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(4,2,7,.78);padding:12px;box-sizing:border-box}
#reader.on{display:flex}
#sheet{position:relative;width:min(94vw,560px);height:min(88vh,740px);padding:30px 28px 22px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
#sheet .pol{flex:none;width:min(52%,230px,30vh);transform:rotate(2.5deg)}
#sheet .ph{cursor:pointer;font-size:15px}
#sheet .cap{font-size:22px}
#txt{flex:1;min-height:0;width:100%;box-sizing:border-box;resize:none;border:0;outline:none;background:repeating-linear-gradient(transparent 0 31px,rgba(90,55,20,.3) 31px 32px) local;font:500 24px/32px 'Caveat',cursive;color:#2a190b;padding:0 4px}
#txt::placeholder{color:rgba(52,32,15,.5)}
.pill{font:600 14px 'Fraunces',serif;color:#34200f;background:rgba(255,240,205,.35);border:1px solid rgba(60,36,14,.5);border-radius:999px;padding:6px 14px;cursor:pointer}
#done{position:absolute;top:10px;right:12px}
#rm{position:absolute;top:10px;left:12px}
@media (prefers-reduced-motion:reduce){.flick,.ember{animation:none}}
</style>
</head>
<body>
<div id="stage" role="button" tabindex="0" aria-label="Tap the candle repeatedly to light it">
<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
<defs>
<linearGradient id="body"><stop offset="0" stop-color="#2c150a"/><stop offset=".3" stop-color="#5b3219"/><stop offset=".6" stop-color="#4a2713"/><stop offset="1" stop-color="#26120a"/></linearGradient>
<radialGradient id="top" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#6a3b1f"/><stop offset="1" stop-color="#4a2713"/></radialGradient>
<linearGradient id="plate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2d7c6"/><stop offset="1" stop-color="#8d8173"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#ffb347" stop-opacity=".55"/><stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/></radialGradient>
<radialGradient id="flameg" cx=".5" cy=".7" r=".6"><stop offset="0" stop-color="#fff3b8"/><stop offset=".5" stop-color="#ffc247"/><stop offset="1" stop-color="#ff7a18"/></radialGradient>
</defs>
<g id="world">
<g id="base">
<ellipse cx="400" cy="440" rx="335" ry="98" fill="url(#plate)"/>
<ellipse cx="400" cy="440" rx="272" ry="78" fill="#000" opacity=".3"/>
<path d="M140 300V430A260 70 0 0 0 660 430V300Z" fill="url(#body)"/>
<path d="M140 365A260 70 0 0 0 660 365" fill="none" stroke="#e9d6b0" stroke-width="7"/>
<ellipse cx="400" cy="300" rx="260" ry="70" fill="url(#top)" stroke="#3a1d0e" stroke-width="2.5"/>
<g id="beads"></g>
</g>
<g id="candles"></g>
</g>
</svg>
<div id="dark"></div>
</div>
<canvas id="c"></canvas>
<h1 id="title">Happy 18th Birthday, Jian!</h1>
<p id="hint">Tap the candle again and again</p>
<button id="open" type="button">Open your letters</button>
<div id="letters"></div>
<div id="reader"><div id="sheet" class="paper" role="dialog" aria-label="Letter"></div></div>
<input type="file" id="file" accept="image/*" hidden>
<script>
const $=id=>document.getElementById(id);
const edge=(x,cy)=>cy+70*Math.sqrt(Math.max(0,1-((x-400)/260)**2));

// Classic piped border along the front of the top rim
let b='';
for(let x=150;x<=650;x+=25){const y=edge(x,300);
  b+=`<circle cx="${x}" cy="${y.toFixed(1)}" r="10" fill="#4a2713" stroke="#2c150a" stroke-width="1.5"/><circle cx="${x-3}" cy="${(y-3).toFixed(1)}" r="3" fill="#8a5230" opacity=".7"/>`}
$('beads').innerHTML=b;

// 18 candles: 1 centre + 6 inner ring + 11 outer ring
const P=[[400,300,0]];
for(let i=0;i<6;i++){const a=i*Math.PI/3;P.push([400+95*Math.cos(a),300+26*Math.sin(a),P.length])}
for(let i=0;i<11;i++){const a=.3+i*2*Math.PI/11;P.push([400+195*Math.cos(a),300+52*Math.sin(a),P.length])}
const cols=['#ff7eb6','#ffd166','#6ee7f2','#b794f6','#8ee59e','#ff9e5e','#f4f4f4'];
const FLAME='<circle class="gl" cy="-12" r="52" fill="url(#glow)"/><g class="flick"><path d="M0 2C-8 -4-7 -14 0 -27C7 -14 8 -4 0 2Z" fill="url(#flameg)"/><path d="M0 1C-3.5 -2-3 -7 0 -13C3 -7 3.5 -2 0 1Z" fill="#fff8dc"/></g>';
let html='';
P.slice().sort((a,b)=>a[1]-b[1]).forEach(([x,y,i])=>{
  const col=i?cols[i%cols.length]:'#f3e2c0';
  const dl=(Math.hypot(x-400,(y-300)*3)/260+Math.random()*.25).toFixed(2);
  const fa=-Math.random().toFixed(2);
  html+=`<g class="${i?'oc':''}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><ellipse rx="8" ry="3" cy="1" fill="#000" opacity=".4"/><rect x="-4.5" y="-58" width="9" height="58" rx="2" fill="${col}"/><path d="M-4.5 -44l9-5M-4.5 -30l9-5M-4.5 -16l9-5" stroke="#fff" stroke-opacity=".55" stroke-width="2.5"/><path d="M0-58v-5" stroke="#1a1a1a" stroke-width="1.4"/>`
   +(i?'':'<g id="emb"><circle cy="-63" r="14" fill="url(#glow)" opacity=".6"/><circle class="ember" cy="-63" r="1.8" fill="#ff7a2a"/></g>')
   +`<g class="fl${i?' o':''}" ${i?`style="transition-delay:${dl}s;animation-delay:${fa}s"`:'id="fc"'}>${FLAME}</g></g>`;
});
$('candles').innerHTML=html;

// Zoom helpers: start zoomed on the centre candle, end at the full cake
const world=$('world'),dark=$('dark'),fc=$('fc'),emb=$('emb'),hint=$('hint');
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches,q=calm?.4:1;
const s0=()=>{const u=Math.min(innerWidth/800,innerHeight/600);return Math.min(9,Math.max(2.4,.42*innerHeight/(90*u)))};
const zoomIn=()=>`translate(400px,300px) scale(${s0()}) translate(-400px,-262px)`;
const zoomOut='translate(400px,300px) scale(1) translate(-400px,-300px)';
world.style.transform=zoomIn();
addEventListener('resize',()=>{size();if(!revealed){world.style.transition='none';world.style.transform=zoomIn()}});

// Confetti
const cv=$('c'),cx=cv.getContext('2d');let W,H;
function size(){const r=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;cx.setTransform(r,0,0,r,0,0)}
size();
const cc=['#ff5d8f','#ffd23f','#3ec1d3','#9b5de5','#7bd88f','#ff8a3d','#ffffff'];
let parts=[];
function burst(x,y,n,ang,spread,speed){for(let i=0;i<n;i++){const a=ang+(Math.random()-.5)*spread,s=speed*(.5+Math.random());
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,w:6+Math.random()*7,h:3+Math.random()*5,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,c:cc[Math.random()*cc.length|0],round:Math.random()<.25,t:0,ph:Math.random()*6.28})}}
let rainFrom=0,rainUntil=0,acc=0;
function celebrate(){const sp=Math.max(15,H*.025);
  burst(-10,H+10,Math.round(90*q),-Math.PI/3,.6,sp);burst(W+10,H+10,Math.round(90*q),-Math.PI*2/3,.6,sp);
  setTimeout(()=>{burst(-10,H+10,Math.round(70*q),-Math.PI/3.3,.6,sp);burst(W+10,H+10,Math.round(70*q),-Math.PI*2/3.1,.6,sp)},700);
  rainFrom=performance.now();rainUntil=rainFrom+8000}

// State
let light=0,pulse=0,fs=0,revealed=false,last=performance.now(),rad=innerHeight*.26,R=0;
function poke(x,y){
  if(document.body.classList.contains('letters'))return;
  if(!revealed){light=Math.min(1.02,light+.085);pulse=1}
  else burst(x,y,Math.round(45*q),-Math.PI/2,Math.PI*1.4,9)}
function reveal(){
  revealed=true;R=Math.hypot(innerWidth,innerHeight)*1.2;
  hint.classList.add('gone');
  world.getBoundingClientRect();
  world.style.transition=`transform ${calm?1.5:4}s cubic-bezier(.6,0,.2,1)`;
  world.style.transform=zoomOut;
  world.classList.add('show');
  setTimeout(()=>world.classList.add('on'),1800);
  setTimeout(()=>{dark.style.transition='opacity 1.5s';dark.style.opacity=0},2400);
  setTimeout(()=>{document.body.classList.add('party');celebrate()},3000)}

function frame(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(!revealed){
    light=Math.max(0,light-.11*dt);pulse=Math.max(0,pulse-dt*5);
    const tr=innerHeight*.26*(1+light*2.2)+pulse*18;
    rad+=(tr-rad)*Math.min(1,dt*10);
    fs=Math.pow(Math.max(0,(light-.05)/.95),.6);
    if(light>=1)reveal();
  }else{
    rad+=(R-rad)*Math.min(1,dt*1.6);fs+=(1-fs)*Math.min(1,dt*4);
  }
  dark.style.setProperty('--r',rad.toFixed(1)+'px');
  fc.style.transform=`translate(0px,-62px) scale(${Math.max(.001,fs*(1+pulse*.2)).toFixed(3)})`;
  emb.style.opacity=Math.max(0,1-fs*6);

  if(t>rainFrom&&t<rainUntil){acc+=dt;while(acc>.07/q){acc-=.07/q;burst(Math.random()*W,-12,1,Math.PI/2,.5,1.2)}}
  cx.clearRect(0,0,W,H);
  const k=dt*60;
  for(let i=parts.length;i--;){const p=parts[i];
    p.vy+=.12*k;p.vx*=Math.pow(.98,k);p.vy*=Math.pow(.98,k);
    p.t+=dt;p.x+=(p.vx+Math.sin(p.t*3+p.ph)*.5)*k;p.y+=p.vy*k;p.r+=p.vr*k;
    if(p.y>H+30){parts.splice(i,1);continue}
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.scale(1,Math.cos(p.t*6+p.ph));cx.fillStyle=p.c;
    if(p.round){cx.beginPath();cx.arc(0,0,p.h*.7,0,6.283);cx.fill()}else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    cx.restore()}
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);

// ---- Letters ----

/* ===== EDIT ME: default captions and letter text (c = polaroid caption, max 28 characters; t = letter) ===== */
const TEXT=[
 {c:'Letter #1',
  t:`Dear Jian,

Happy 18th birthday, honey! You are stepping into a bigger world today. Stay curious, Stay kind, and don’t rush things. The best things take time.

“Therefore what God has joined together, let no one seperate.”
Mark 10:9`},

 {c:'Letter #2',
  t:`Dear Jian,

Some days will be easy and some will be hard, and both will teach you something. Keep going, and be proud of how far you have already come.

“Love is patient, Love is kind. It does not envy, it does not boast, it is not proud... it always protects, always trusts, always hopes, always persevere.”
1st Corinthians 13:4-7`},

 {c:'Letter #3',
  t:`Oh, my shining moon,

"I am happy to spend your 18th birthday with you. May our love continue to choose each other, may we continue to grow together. I will spend the my lifetimes loving you, and I will never stop finding you in another life. I love you to the moon and back, and I will always be your home :)""
"Bear with each other and forgive one another if any of you has a grievance against someone. Forgive as the Lord forgave you.”
Colossians 3:13`}
];
/* ===== end of editable text ===== */
const L=TEXT.map((x,k)=>({t:x.t,i:DEF[k],c:x.c}));
try{const s=JSON.parse(localStorage.getItem(KEY));
  if(Array.isArray(s))s.slice(0,3).forEach((v,k)=>{if(!v)return;L[k].t=String(v.t||'');L[k].c=String(v.c||'');L[k].i=String(v.i||'').startsWith('data:image/')?v.i:L[k].i})}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(L))}catch(e){}};
const mk=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt)e.textContent=txt;return e};

function pol(k,edit){
  const p=mk('div','pol'),ph=mk('div','ph');
  if(L[k].i)ph.style.backgroundImage=`url("${L[k].i}")`;else ph.textContent=edit?'Click to add a picture':'+';
  let cap;
  if(edit){cap=mk('input','cap');cap.maxLength=28;cap.placeholder='Add a caption';cap.value=L[k].c;cap.oninput=()=>{L[k].c=cap.value;save()};
    ph.onclick=()=>{$('file').value='';$('file').click()};
    ph.ondragover=e=>e.preventDefault();ph.ondrop=e=>{e.preventDefault();takeFile(e.dataTransfer.files[0])}}
  else cap=mk('div','cap',L[k].c);
  p.append(ph,cap);return p}

function renderCards(){
  const w=$('letters');w.textContent='';
  L.forEach((l,k)=>{
    const c=mk('div','letter paper');c.tabIndex=0;c.setAttribute('role','button');c.setAttribute('aria-label','Open letter '+(k+1));
    c.append(pol(k,false),mk('div','pv'+(l.t?'':' empty'),l.t||'Click to write'));
    c.onclick=()=>openReader(k);
    c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openReader(k)}};
    w.append(c)})}
renderCards();

let cur=-1;
function openReader(k){
  cur=k;const s=$('sheet');s.textContent='';
  const done=mk('button','pill','Done');done.id='done';done.type='button';done.onclick=closeReader;
  const ta=mk('textarea');ta.id='txt';ta.placeholder='Write your letter here';ta.value=L[k].t;ta.oninput=()=>{L[k].t=ta.value;save()};
  s.append(done);
  if(L[k].i){const rm=mk('button','pill','Remove picture');rm.id='rm';rm.type='button';rm.onclick=()=>{L[k].i='';save();openReader(k)};s.append(rm)}
  s.append(pol(k,true),ta);
  $('reader').classList.add('on');ta.focus()}
function closeReader(){cur=-1;$('reader').classList.remove('on');renderCards()}
$('reader').addEventListener('pointerdown',e=>{if(e.target===$('reader'))closeReader()});

function takeFile(f){
  if(!f||!f.type.startsWith('image/')||cur<0)return;
  const k=cur,fr=new FileReader();
  fr.onload=()=>{const im=new Image();
    im.onload=()=>{const s=Math.min(1,640/Math.max(im.width,im.height)),cv=document.createElement('canvas');
      cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      L[k].i=cv.toDataURL('image/jpeg',.82);save();if(cur===k)openReader(k)};
    im.src=fr.result};
  fr.readAsDataURL(f)}
$('file').addEventListener('change',e=>takeFile(e.target.files[0]));

$('open').addEventListener('click',()=>{
  const on=document.body.classList.toggle('letters');
  $('open').textContent=on?'Back to the cake':'Open your letters'});

$('stage').addEventListener('pointerdown',e=>poke(e.clientX,e.clientY));
addEventListener('keydown',e=>{
  if($('reader').classList.contains('on')){if(e.key==='Escape')closeReader();return}
  if(e.target!==$('stage')&&e.target!==document.body)return;
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();poke(innerWidth/2,innerHeight/2)}});
setTimeout(()=>{if(!revealed)hint.classList.add('show')},1200);
</script>
